name: Listening course depth

on:
  push:
    branches:
      - feat/course-depth-listening

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[listening-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-listening
          fetch-depth: 0

      - name: Integrate generated listening bank
        run: node scripts/apply-listening-course-depth.cjs

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen English listening for course-long use [listening-depth]"
          git push origin HEAD:feat/course-depth-listening
