name: Production health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production health endpoint
        env:
          HEALTH_URL: https://level-up-a544.vercel.app/api/health
        run: |
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$HEALTH_URL")"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.status !== "ok" || health.service !== "level-up" || health.version !== "1.2.0") {
              throw new Error(`Unexpected health response: ${process.argv[1]}`)
            }
            console.log(`LEVEL UP ${health.version} is healthy (${health.deployment ?? "local"})`)
          ' "$response"
