name: Production health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://level-up-a544.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production health endpoint
        run: |
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$BASE_URL/api/health")"
          node scripts/verify-production-health.cjs "$response" "$GITHUB_SHA"

      - name: Smoke public and core entry routes
        run: |
          check_page() {
            path="$1"
            marker="$2"
            body="$(curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$BASE_URL$path")"
            printf '%s' "$body" | grep -Fq "$marker" || {
              echo "Expected marker '$marker' missing from $path" >&2
              exit 1
            }
            echo "$path is reachable and contains its expected marker"
          }

          check_page "/" "Aprende, explora y sube de nivel."
          check_page "/login" "Comprobando sesión…"
          check_page "/parent/setup" "Comprobando sesión…"
          check_page "/player" "Comprobando sesión…"
          check_page "/mission" "Comprobando acceso..."
          check_page "/parent" "Cargando progreso real…"

      - name: Smoke all production district routes
        run: |
          check_district() {
            path="$1"
            mode="$2"
            body="$(curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 "$BASE_URL$path")"
            printf '%s' "$body" | grep -Fq "Comprobando acceso..." || {
              echo "Mission guard marker missing from $path" >&2
              exit 1
            }
            printf '%s' "$body" | grep -Fq "\\\"mode\\\":\\\"$mode\\\"" || {
              echo "Expected mode '$mode' missing from $path" >&2
              exit 1
            }
            echo "$path serves MissionGuard with $mode"
          }

          check_district "/zone/math/numbers" "math_numbers"
          check_district "/zone/math/algebra" "math_algebra"
          check_district "/zone/math/geometry-data" "math_geometry_data"
          check_district "/zone/language/reading" "spanish_reading"
          check_district "/zone/language/words" "spanish_words"
          check_district "/zone/language/writing" "spanish_writing"
          check_district "/zone/english/listening" "english_listening"
          check_district "/zone/english/conversation" "english_conversation"
          check_district "/zone/english/terminal" "english_terminal"
          check_district "/zone/science/life" "science_life"
          check_district "/zone/science/investigation" "science_investigation"
          check_district "/zone/science/observatory" "science_observatory"
          check_district "/zone/geography/maps" "geography_maps"
          check_district "/zone/geography/physical" "geography_physical"
          check_district "/zone/geography/history" "history_ancient"

      - name: Verify baseline security headers
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 20 --dump-header "$headers" --output /dev/null "$BASE_URL/"
          grep -Eiq '^content-security-policy:' "$headers"
          grep -Eiq '^strict-transport-security:' "$headers"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers"
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$headers"
          echo "Baseline production security headers are present"
