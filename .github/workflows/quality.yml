name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Audit question generators
        run: npm run audit:questions

      - name: Audit pedagogical question quality
        run: npm run audit:question-quality

      - name: Audit multi-subject curriculum
        run: npm run audit:multi-subject-curriculum

      - name: Audit active subject plans
        run: npm run audit:active-subject-plans

      - name: Audit Spanish and English generators
        run: npm run audit:language-generators

      - name: Audit Geography History and Biology generators
        run: npm run audit:knowledge-generators

      - name: Audit multi-subject question diversity
        run: npm run audit:multi-subject-diversity

      - name: Audit English Terminal variety
        run: npm run audit:english-terminal-variety

      - name: Audit longitudinal adaptive behavior
        run: npm run audit:adaptive-engine

      - name: Audit parent insight thresholds
        run: npm run audit:parent-insights

      - name: Audit multi-subject parent dashboard
        run: npm run audit:parent-multi-subject

      - name: Audit mission recap evidence
        run: npm run audit:mission-recap

      - name: Audit mission feedback semantics
        run: npm run audit:mission-feedback

      - name: Audit curriculum unit insights
        run: npm run audit:curriculum-insights

      - name: Audit curriculum planning
        run: npm run audit:curriculum-plan

      - name: Audit migration history
        run: npm run audit:migrations

      - name: Audit SECURITY DEFINER hardening
        run: npm run audit:security-definer

      - name: Audit runtime version
        run: npm run audit:runtime

      - name: Audit production health drift verifier
        run: |
          version="$(node -p "require('./package.json').version")"
          deployment="${GITHUB_SHA:0:7}"
          node scripts/verify-production-health.cjs "{\"status\":\"ok\",\"service\":\"level-up\",\"version\":\"$version\",\"deployment\":\"$deployment\"}" "$GITHUB_SHA"

      - name: Audit v1 release readiness
        run: npm run audit:release

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
