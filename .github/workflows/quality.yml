name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Audit question generators
        run: npm run audit:questions

      - name: Audit pedagogical question quality
        run: npm run audit:question-quality

      - name: Audit distractor plausibility
        run: npm run audit:distractor-quality

      - name: Audit math operation semantics
        run: node scripts/audit-math-operations-semantics.cjs

      - name: Audit M01S05 order semantics
        run: node scripts/audit-m01-order-semantics.cjs

      - name: Audit M14S01 sampling recurrence
        run: node scripts/audit-m14-sampling-recurrence.cjs

      - name: Audit M15S04 Laplace recurrence
        run: node scripts/audit-m15-laplace-recurrence.cjs

      - name: Audit M15S02 event recurrence
        run: node scripts/audit-m15-events-recurrence.cjs

      - name: Audit M15S03 favorable and possible recurrence
        run: node scripts/audit-m15-favorable-recurrence.cjs

      - name: Audit M15S01 random experiment recurrence
        run: node scripts/audit-m15-random-experiments-recurrence.cjs

      - name: Audit M04S01 integer recurrence
        run: node scripts/audit-m04-integer-recurrence.cjs

      - name: Audit M13S03 graph recurrence
        run: node scripts/audit-m13-graph-recurrence.cjs

      - name: Audit M14S04 statistical graph recurrence
        run: node scripts/audit-m14-graphs-recurrence.cjs

      - name: Audit M14S02 variable recurrence
        run: node scripts/audit-m14-variable-recurrence.cjs

      - name: Audit playability blockers
        run: node scripts/audit-playability-blockers.cjs

      - name: Audit course-long practice continuity
        run: node scripts/audit-practice-antirepeat.cjs

      - name: Simulate a full school year of curriculum practice
        run: node scripts/audit-course-year-simulation.cjs

      - name: Audit multi-subject curriculum
        run: npm run audit:multi-subject-curriculum

      - name: Audit multi-subject mission rotation
        run: npm run audit:multi-subject-rotation

      - name: Audit explorer community privacy
        run: node scripts/audit-explorer-community.cjs

      - name: Audit active subject plans
        run: npm run audit:active-subject-plans

      - name: Audit Spanish and English generators
        run: npm run audit:language-generators

      - name: Audit Spanish words course depth
        run: node scripts/audit-spanish-words-depth.cjs

      - name: Audit upper Spanish course depth
        run: node scripts/audit-spanish-upper-course-depth.cjs

      - name: Audit English conversation course depth
        run: node scripts/audit-english-conversation-depth.cjs

      - name: Audit geology observatory course depth
        run: node scripts/audit-geology-course-depth.cjs

      - name: Audit science investigation course depth
        run: node scripts/audit-science-investigation-course-depth.cjs

      - name: Audit biology and ecosystems course depth
        run: node scripts/audit-science-life-course-depth.cjs

      - name: Audit health and sustainability course depth
        run: node scripts/audit-science-health-course-depth.cjs

      - name: Audit geography course depth
        run: node scripts/audit-geography-course-depth.cjs

      - name: Audit history course depth
        run: node scripts/audit-history-course-depth.cjs

      - name: Audit Geography History and Biology generators
        run: npm run audit:knowledge-generators

      - name: Audit multi-subject question diversity
        run: npm run audit:multi-subject-diversity

      - name: Audit English Terminal variety
        run: npm run audit:english-terminal-variety

      - name: Audit English Terminal course depth
        run: node scripts/audit-english-terminal-course-depth.cjs

      - name: Audit English Listening quality
        run: npm run audit:english-listening-quality

      - name: Audit all world districts
        run: npm run audit:world-zones

      - name: Audit server-side practice skill scope
        run: npm run audit:practice-skill-scope

      - name: Audit serialized session switching
        run: npm run audit:session-switching

      - name: Audit longitudinal adaptive behavior
        run: npm run audit:adaptive-engine

      - name: Audit fresh-player adaptive progression
        run: npm run audit:fresh-player-adaptive

      - name: Audit parent insight thresholds
        run: npm run audit:parent-insights

      - name: Audit multi-subject parent dashboard
        run: npm run audit:parent-multi-subject

      - name: Audit mission recap evidence
        run: npm run audit:mission-recap

      - name: Audit mission feedback semantics
        run: npm run audit:mission-feedback

      - name: Audit curriculum unit insights
        run: npm run audit:curriculum-insights

      - name: Audit curriculum planning
        run: npm run audit:curriculum-plan

      - name: Audit migration history
        run: npm run audit:migrations

      - name: Audit SECURITY DEFINER hardening
        run: npm run audit:security-definer

      - name: Audit runtime version
        run: npm run audit:runtime

      - name: Audit production health drift verifier
        run: |
          version="$(node -p "require('./package.json').version")"
          deployment="${GITHUB_SHA:0:7}"
          node scripts/verify-production-health.cjs "{\"status\":\"ok\",\"service\":\"level-up\",\"version\":\"$version\",\"deployment\":\"$deployment\"}" "$GITHUB_SHA"

      - name: Audit v1 release readiness
        run: npm run audit:release

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
