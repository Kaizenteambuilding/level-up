name: Polish English terminal depth

on:
  push:
    branches:
      - feat/course-depth-english-terminal

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-english-terminal
          fetch-depth: 0

      - name: Polish terminal language
        run: node scripts/fix-english-terminal-depth-quality.cjs

      - name: Commit polished sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish English terminal generated language [terminal-polish]"
          git push origin HEAD:feat/course-depth-english-terminal
