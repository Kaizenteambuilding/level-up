name: Fix listening authored overlap

on:
  push:
    branches:
      - feat/course-depth-listening

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[listening-authored-overlap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-listening
          fetch-depth: 0

      - name: Apply overlap cleanup
        run: node scripts/fix-listening-authored-overlap.cjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove authored listening overlap [listening-authored-overlap]"
          git push origin HEAD:feat/course-depth-listening
