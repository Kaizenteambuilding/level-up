name: Spanish words course depth

on:
  push:
    branches:
      - feat/course-depth-spanish-words

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[words-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-spanish-words
          fetch-depth: 0

      - name: Integrate words depth
        run: node scripts/apply-spanish-words-depth.cjs

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen Spanish grammar and vocabulary for the school year [words-depth]"
          git push origin HEAD:feat/course-depth-spanish-words
