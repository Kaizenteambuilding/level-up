name: Spanish reading course depth

on:
  push:
    branches:
      - feat/course-depth-spanish-reading

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[reading-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-spanish-reading
          fetch-depth: 0

      - name: Integrate reading depth
        run: node scripts/apply-spanish-reading-depth.cjs

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen Spanish reading for the school year [reading-depth]"
          git push origin HEAD:feat/course-depth-spanish-reading
