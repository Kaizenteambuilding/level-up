name: Mission progress safety fix

on:
  push:
    branches:
      - fix/mission-progress-safety

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mission-progress-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize mission progress calculations
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const componentsDir = 'components'
          const changed = []
          for (const name of fs.readdirSync(componentsDir)) {
            if (!name.endsWith('Session.tsx')) continue
            const file = path.join(componentsDir, name)
            const before = fs.readFileSync(file, 'utf8')
            const after = before.replace(/Number\(\s*answered\s*&&\s*feedback\s*\)/g, 'Number(Boolean(answered && feedback))')
            if (after !== before) {
              fs.writeFileSync(file, after)
              changed.push(file)
            }
          }

          const auditFile = 'scripts/audit-mission-feedback.cjs'
          if (fs.existsSync(auditFile)) {
            const before = fs.readFileSync(auditFile, 'utf8')
            let after = before.replace(
              'const savedProgress = Math.min(SESSION_LENGTH, index + Number(answered && feedback))',
              'const savedProgress = Math.min(SESSION_LENGTH, index + Number(Boolean(answered && feedback)))'
            )
            const guard = `\nconst unsafeProgress = /Number\\(\\s*answered\\s*&&\\s*feedback\\s*\\)/\nfor (const name of fs.readdirSync('components')) {\n  if (!name.endsWith('Session.tsx')) continue\n  const sessionSource = fs.readFileSync('components/' + name, 'utf8')\n  if (unsafeProgress.test(sessionSource)) failures.push('unsafe-progress:' + name)\n}\n`
            if (!after.includes('unsafe-progress:')) after = after.replace('\nfor (const marker of required) {', guard + '\nfor (const marker of required) {')
            if (after !== before) {
              fs.writeFileSync(auditFile, after)
              changed.push(auditFile)
            }
          }

          console.log('Updated:', changed.join(', '))
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/mission-progress-safety-fix.yml
      - name: Commit fixes
        run: |
          git config user.name "Kaizenteambuilding"
          git config user.email "luislopez@kaizenteambuilding.com"
          git add components scripts/audit-mission-feedback.cjs .github/workflows/mission-progress-safety-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: harden mission progress state"
          git push origin HEAD:fix/mission-progress-safety
