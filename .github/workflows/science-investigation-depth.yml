name: Science investigation course depth

on:
  push:
    branches:
      - feat/course-depth-science-investigation

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[science-investigation-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-science-investigation
          fetch-depth: 0

      - name: Integrate science investigation depth
        run: node scripts/apply-science-investigation-depth.cjs

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen science investigation for the school year [science-investigation-depth]"
          git push origin HEAD:feat/course-depth-science-investigation
