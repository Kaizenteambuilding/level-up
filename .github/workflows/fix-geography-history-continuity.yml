name: Fix geography history continuity

on:
  push:
    branches:
      - feat/course-depth-science-investigation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[geography-history-continuity]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-science-investigation
          fetch-depth: 0

      - name: Apply continuity fixes
        run: node scripts/fix-geography-history-continuity.cjs

      - name: Commit continuity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep geography and history playable after fresh pool exhaustion [geography-history-continuity]"
          git push origin HEAD:feat/course-depth-science-investigation
