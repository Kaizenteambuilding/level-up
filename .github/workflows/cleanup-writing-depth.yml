name: Clean writing depth branch

on:
  push:
    branches:
      - feat/course-depth-spanish-writing

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[writing-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-spanish-writing
          fetch-depth: 0

      - name: Remove accidental dependencies from git
        run: |
          git rm -r --cached --ignore-unmatch node_modules
          rm -rf node_modules

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove accidental dependency files [writing-clean]"
          git push origin HEAD:feat/course-depth-spanish-writing
