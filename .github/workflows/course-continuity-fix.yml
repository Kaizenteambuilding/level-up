name: Course continuity transform

on:
  push:
    branches:
      - fix/course-long-continuity

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[course-continuity]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-long-continuity
          fetch-depth: 0

      - name: Apply course-long continuity changes
        run: node scripts/apply-course-continuity.cjs

      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make practice sustainable across the school year [course-continuity]"
          git push origin HEAD:fix/course-long-continuity
