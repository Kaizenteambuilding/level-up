name: Fix listening duplicates

on:
  push:
    branches:
      - feat/course-depth-listening

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[listening-duplicates]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-listening
          fetch-depth: 0

      - name: Apply duplicate cleanup
        run: node scripts/fix-listening-duplicate-spoken.cjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove duplicate generated listening prompts [listening-duplicates]"
          git push origin HEAD:feat/course-depth-listening
