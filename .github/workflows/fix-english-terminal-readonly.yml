name: Fix English terminal readonly typing

on:
  push:
    branches:
      - feat/course-depth-english-terminal

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-readonly]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-english-terminal
          fetch-depth: 0

      - name: Apply typing fix
        run: node scripts/fix-english-terminal-readonly.cjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: accept readonly English terminal banks [terminal-readonly]"
          git push origin HEAD:feat/course-depth-english-terminal
