name: Geology observatory course depth

on:
  push:
    branches:
      - feat/course-depth-geology-observatory

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[geology-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-geology-observatory
          fetch-depth: 0

      - name: Integrate geology depth
        run: node scripts/apply-geology-course-depth.cjs

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen geology observatory for the school year [geology-depth]"
          git push origin HEAD:feat/course-depth-geology-observatory
