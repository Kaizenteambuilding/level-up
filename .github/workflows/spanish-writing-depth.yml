name: Spanish writing course depth

on:
  push:
    branches:
      - feat/course-depth-spanish-writing

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[writing-depth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-depth-spanish-writing
          fetch-depth: 0

      - name: Apply writing depth
        run: node scripts/apply-spanish-writing-depth.cjs

      - name: Install locked dependencies
        run: npm ci

      - name: Verify writing depth
        run: node scripts/audit-spanish-writing-depth.cjs

      - name: Type-check application
        run: npm run lint

      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deepen Spanish writing for the school year [writing-depth]"
          git push origin HEAD:feat/course-depth-spanish-writing
